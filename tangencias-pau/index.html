:root{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:#233449;background:#f3f5f8;--blue:#246be8}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;padding:clamp(14px,2.5vw,30px);display:flex;justify-content:center}
.wrap{width:100%;max-width:950px}
.top{display:flex;align-items:center;justify-content:center;gap:19px;margin:0 auto 18px}
.crest{display:block;width:52px;height:68px;object-fit:contain;flex-shrink:0}
.heading{min-width:0}
.eyebrow{font-size:11px;font-weight:750;letter-spacing:.115em;text-transform:uppercase;color:#64758b;margin-bottom:5px}
h1{font-size:clamp(19px,2.85vw,29px);line-height:1.2;letter-spacing:-.025em;margin:0;font-weight:780}
.card{background:#fff;border:1px solid #e0e7ef;border-radius:17px;overflow:hidden;box-shadow:0 8px 28px rgba(28,46,74,.055)}
.stage{width:min(100%,calc(68vh * 221 / 143));height:auto;display:block;margin:0 auto;background:#fbfcfe}
.stage text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;paint-order:stroke;stroke:#fbfcfe;stroke-width:.9;stroke-linejoin:round}
.stage .small-label{font-size:4.3px;fill:#263c52;font-weight:700}
.stage .muted-label{font-size:3.8px;fill:#6f7d8d;font-weight:600}
.stage .purple-label{font-size:4.1px;fill:#7046c3;font-weight:800}
.stage .blue-label{font-size:4.2px;fill:#215fc7;font-weight:800}
.stage .green-label{font-size:4.1px;fill:#168354;font-weight:800}
.stage line,.stage circle,.stage path,.stage polygon{vector-effect:non-scaling-stroke}
.caption-area{padding:11px 25px 13px;min-height:68px;display:flex;align-items:center;justify-content:center;border-top:1px solid #edf1f6;background:#fff}
#phaseText{max-width:730px;text-align:center;font-size:clamp(13px,1.4vw,15px);line-height:1.45;font-weight:510;color:#445973}
.controls{display:flex;justify-content:center;margin-top:15px}
#play{appearance:none;border:0;border-radius:11px;background:#2869db;color:white;min-width:185px;padding:12px 26px;font:inherit;font-size:15px;font-weight:700;cursor:pointer;box-shadow:0 5px 11px rgba(40,105,219,.2);transition:background .15s,transform .15s}
#play:hover{background:#1556c2}
#play:active{transform:scale(.98)}
#play:focus-visible{outline:3px solid #93bafd;outline-offset:4px}
@media(max-width:550px){body{padding:12px}.top{gap:12px;margin-bottom:14px;justify-content:flex-start}.crest{width:42px;height:56px}.eyebrow{font-size:10px}h1{font-size:19px}.stage{width:100%}.caption-area{padding:11px 13px;min-height:78px}.card{border-radius:13px}.controls{margin-top:14px}}
@media(prefers-reduced-motion:reduce){#play{transition:none}}
/* Solo se muestran los nombres de los tres datos y sus transformaciones. */
.stage text{display:none}
.stage text.data-label{display:block;font-size:5.1px;font-weight:800;stroke:#fbfcfe;stroke-width:1.2px}
.stage text.data-original{fill:#31485f}
.stage text.data-transform{fill:#7043c8}
.stage text.data-circletransform{fill:#bc791d}
</style>

          <marker id="arrowPurple" markerWidth="5" markerHeight="5" refX="4" refY="2.5" orient="auto"><path d="M0 0 L5 2.5 L0 5 z" fill="#7950d9"/></marker>
          <marker id="arrowBlue" markerWidth="5" markerHeight="5" refX="4" refY="2.5" orient="auto"><path d="M0 0 L5 2.5 L0 5 z" fill="#246be8"/></marker>
        </defs>
        <rect x="-131" y="-82" width="221" height="143" fill="#fbfcfe"/>
        <rect x="-131" y="-82" width="221" height="143" fill="url(#grid)"/>
        <g id="baseGeometry">
          <line id="lineBottom" x1="-131" y1="0" x2="0" y2="0" stroke="#304254" stroke-width="2.5" stroke-linecap="round"/>
          <line id="lineTop" stroke="#238d54" stroke-width="2.5" stroke-linecap="round"/>
          <circle id="givenCircle" cx="-35" cy="-5" r="18" fill="#bd7b28" fill-opacity=".045" stroke="#27374a" stroke-width="2.8"/>
          <circle id="vDot" cx="0" cy="0" r=".9" fill="#21374b" stroke="white" stroke-width="1"/>
          <text x="2.6" y="-2.4" class="small-label">V</text>
          <text id="pointOriginalLabel" x="-30.8" y="-2.1" class="muted-label">O</text>
          <text id="givenRadiusText" x="-51" y="-9" class="muted-label">r = 18</text>
          <text id="labelS" x="-121" y="-4.2" class="data-label data-original">s</text>
          <text id="labelR" x="-81" y="-70.8" class="data-label data-original">r</text>
          <text id="labelC" x="-29" y="6.5" class="data-label data-original">c</text>
        </g>
        <g id="shiftedGeometry">
          <line id="shiftBottom" stroke="#7a53d4" stroke-width="2.6" stroke-linecap="round"/>
          <line id="shiftTop" stroke="#7a53d4" stroke-width="2.6" stroke-linecap="round"/>
          <circle id="vprimeDot" r="1.05" fill="#7950d9" stroke="white" stroke-width="1.1"/>
          <text id="vprimeLabel" class="purple-label">V′</text>
          <text id="labelSprime" class="data-label data-transform">s′</text>
          <text id="labelRprime" class="data-label data-transform">r′</text>
          <g id="offsetArrows" opacity="0">
            <line id="bottomArrow" stroke="#7a53d4" stroke-width="1.5" marker-end="url(#arrowPurple)"/>
            <line id="topArrow" stroke="#7a53d4" stroke-width="1.5" marker-end="url(#arrowPurple)"/>
            <text id="bottomOffsetLabel" class="purple-label">18 mm</text>
            <text id="topOffsetLabel" class="purple-label">18 mm</text>
          </g>
        </g>
        <g id="pointGeometry" opacity="0">
          <circle cx="-35" cy="-5" r="1.5" fill="#d17c21" stroke="white" stroke-width="1.4"/>
          <text x="-31.5" y="-7.7" class="small-label">P ≡ O</text>
          <text x="-30.5" y="-9.0" class="data-label data-circletransform">c′</text>
        </g>
        <g id="bisectorGroup" opacity="0">
          <line id="bisectorLine" stroke="#6e8cba" stroke-width="1.5" stroke-dasharray="5 4"/>
          <text id="bisectorLabel" class="muted-label">bisectriz</text>
        </g>
        <g id="reflectionGroup" opacity="0">
          <line id="reflectionLine" stroke="#e2962c" stroke-width="1.8" stroke-dasharray="3 3"/>
          <circle id="mirrorMid" r=".9" fill="#e2962c"/>
          <circle id="mirrorPoint" r="1.6" stroke="white" stroke-width="1" fill="#d68b25"/>
          <text id="mirrorLabel" class="small-label">P′</text>
          <text x="-69" y="-33" class="muted-label" id="mirrorDetail">P y P′ son simétricos</text>
        </g>
        <g id="powerGroup" opacity="0">
          <line id="secantLine" stroke="#dd982b" stroke-width="1.7" stroke-dasharray="4 3"/>
          <circle id="powerX" r="1.5" fill="#d58723" stroke="white" stroke-width="1.2"/>
          <text id="powerXlabel" class="small-label">X</text>
          <line id="powerSegment" stroke="#7950d9" stroke-width="2.7" stroke-linecap="round"/>
          <circle id="powerH" r="1.5" fill="#7950d9" stroke="white" stroke-width="1.2"/>
          <circle id="powerHother" r="1.1" fill="#94a1af" stroke="white" stroke-width=".8"/>
          <text id="powerHlabel" class="purple-label">H (mayor)</text>
          <text id="powerHotherLabel" class="muted-label">H₂</text>
          <text id="powerFormula" class="purple-label">XH² = XP · XP′</text>
        </g>
        <g id="centerGroup" opacity="0">
          <line id="centerPerp" stroke="#1f72bd" stroke-width="1.8" stroke-dasharray="3.5 2.5"/>
          <circle id="centerDot" r="1.3" fill="#246be8" stroke="white" stroke-width="1.2"/>
          <text id="centerLabel" class="blue-label">C</text>
        </g>
        <circle id="auxCircle" fill="#7950d9" fill-opacity=".025" stroke="#7950d9" stroke-dasharray="8 5" stroke-width="3" opacity="0"/>
        <circle id="finalCircle" fill="#246be8" fill-opacity=".055" stroke="#246be8" stroke-width="3.3" opacity="0"/>
        <g id="finalMarks" opacity="0">
          <circle id="finalCenter" r="1.4" fill="#246be8" stroke="white" stroke-width="1.1"/>
          <text id="finalCenterLabel" class="blue-label">C</text>
          <circle id="contactBottom" r="1.4" fill="#246be8" stroke="white" stroke-width="1"/>
          <text id="contactBottomLabel" class="blue-label">B</text>
          <circle id="contactTop" r="1.4" fill="#246be8" stroke="white" stroke-width="1"/>
          <text id="contactTopLabel" class="blue-label">A</text>
          <circle id="contactCircles" r="1.6" fill="#d5862a" stroke="white" stroke-width="1"/>
          <text id="contactCirclesLabel" class="small-label">Q</text>
          <line id="centersLink" stroke="#b67c3b" stroke-dasharray="4 3" stroke-width="1.2"/>
          <text id="radiusResult" class="blue-label">R ≈ 25,9 mm</text>
        </g>
      </svg>
    <div class="caption-area" aria-live="polite"><span id="phaseText">Partimos de dos rectas y una circunferencia. Buscamos la solución mayor.</span></div>
  </section>
  <div class="controls"><button id="play" type="button">▶ Reproducir</button></div>
</main>
</div>
<script>

'use strict';
// Geometría real (mm); coordenadas SVG con eje Y positivo hacia abajo.
// En el croquis original: 36 mm es el diámetro, de modo que r=18 mm.
const r=18, V={x:0,y:0}, P={x:-35,y:-5};
const add=(a,b)=>({x:a.x+b.x,y:a.y+b.y}), sub=(a,b)=>({x:a.x-b.x,y:a.y-b.y});
const mul=(a,k)=>({x:a.x*k,y:a.y*k});
const dot=(a,b)=>a.x*b.x+a.y*b.y;
const length=a=>Math.hypot(a.x,a.y);
const norm=a=>mul(a,1/length(a));
const lerp=(a,b,t)=>a+(b-a)*t;
const smooth=t=>{let s=Math.max(0,Math.min(1,t));return s*s*(3-2*s)};
const reveal=(t,start,end)=>smooth((t-start)/(end-start));
const w=sub(P,V), d2=dot(w,w);
if(d2<=r*r) throw new Error('La circunferencia impediría trazar una tangente desde V.');
// Tangencia oblicua de V a la circunferencia: rama superior.
const T=add(mul(w,1-r*r/d2),mul({x:-w.y,y:w.x},r*Math.sqrt(d2-r*r)/d2));
const oblique=norm(T), nout={x:-oblique.y,y:oblique.x}; // hacia fuera del ángulo
// Tras desplazar ambas rectas 18 mm hacia fuera, el nuevo vértice es V′.
const Vp={x:r*(1-nout.y)/nout.x,y:r};
const bis=norm(sub(V,Vp)); // la bisectriz desplazada pasa por el V original
// Reflejar el centro P de la circunferencia original respecto de V′V.
const relative=sub(P,Vp);
const P2=add(Vp,sub(mul(bis,2*dot(relative,bis)),relative));
// X: intersección de la secante PP′ con la horizontal dilatada y=r.
const X=add(P,mul(sub(P2,P),(r-P.y)/(P2.y-P.y)));
const power=length(sub(X,P))*length(sub(X,P2));
const tangencyLength=Math.sqrt(power);
const H={x:X.x-tangencyLength,y:r};      // solución mayor
const H2={x:X.x+tangencyLength,y:r};     // solución menor
// Por H una perpendicular a la horizontal; intersección con la bisectriz.
const distAlongBis=(H.x-Vp.x)/bis.x;
const C=add(Vp,mul(bis,distAlongBis));
const bigR=-C.y; // radio final al DESHACER la dilatación
const auxR=bigR+r;
const smallerC=add(Vp,mul(bis,(H2.x-Vp.x)/bis.x));
const smallR=-smallerC.y;
// Contactos finales (coherencia comprobada en mm).
const B={x:C.x,y:0};
const A=add(C,mul(nout,bigR));
const Q=add(C,mul(norm(sub(P,C)),bigR));
const distCP=length(sub(C,P));
if(Math.abs(distCP-bigR-r)>1e-7 || Math.abs(P2.y+r)>1e-7){
  throw new Error('La geometría no satisface las condiciones de tangencia.');
}
const $=id=>document.getElementById(id);
const set=(id,attrs)=>{const e=$(id);Object.entries(attrs).forEach(([k,v])=>e.setAttribute(k,String(v)));return e};
const line=(id,a,b)=>set(id,{x1:a.x,y1:a.y,x2:b.x,y2:b.y});
const point=(id,p)=>set(id,{cx:p.x,cy:p.y});
const label=(id,p)=>set(id,{x:p.x,y:p.y});
const opacity=(id,v)=>set(id,{opacity:Math.max(0,Math.min(1,v)).toFixed(3)});
const stepInfo=[
  'Partimos de dos rectas y una circunferencia. Buscamos la solución mayor.',
  'Separamos ambas rectas 18 mm hacia fuera y reducimos la circunferencia a su centro.',
  'El centro de la circunferencia auxiliar estará en la bisectriz. Reflejamos el punto auxiliar.',
  'Por potencia determinamos el punto de tangencia correspondiente a la solución mayor.',
  'Trazamos la perpendicular desde el punto obtenido y localizamos el centro en la bisectriz.',
  'Devolvemos las rectas a su posición y recuperamos la circunferencia inicial.',
  'Resultado: la circunferencia azul es tangente a ambas rectas y a la circunferencia dada.'
];
// Elementos fijos del problema / construcciones.
line('lineTop',mul(oblique,240),V);
line('bisectorLine',add(Vp,mul(bis,225)),add(Vp,mul(bis,-20)));
label('bisectorLabel',add(Vp,mul(bis,170))); // the label is moved slightly below
line('reflectionLine',P,P2);
const midpoint=mul(add(P,P2),.5);
point('mirrorMid',midpoint); point('mirrorPoint',P2); label('mirrorLabel',add(P2,{x:2.4,y:-3.0}));
line('secantLine',P2,add(X,mul(norm(sub(X,P2)),12)));
point('powerX',X);label('powerXlabel',add(X,{x:2.4,y:5.2}));
line('powerSegment',X,H);point('powerH',H);point('powerHother',H2);
label('powerHlabel',add(H,{x:-15,y:7.2}));
label('powerHotherLabel',add(H2,{x:2.0,y:7.0}));
label('powerFormula', {x:-118,y:37});
line('centerPerp',H,C);point('centerDot',C);label('centerLabel',add(C,{x:-5.8,y:-3.5}));
point('finalCenter',C);label('finalCenterLabel',add(C,{x:-6,y:-3.5}));
point('contactBottom',B);label('contactBottomLabel',add(B,{x:-6,y:7}));
point('contactTop',A);label('contactTopLabel',add(A,{x:-5.8,y:-4.4}));
point('contactCircles',Q);label('contactCirclesLabel',add(Q,{x:3,y:-4}));
line('centersLink',C,P);
label('radiusResult', {x:-114,y:-60});
set('auxCircle',{cx:C.x,cy:C.y,r:auxR});
set('finalCircle',{cx:C.x,cy:C.y,r:bigR});
// Two lines displaced OUTWARD by r: distances are exactly r from originals.
let t=0,playing=false,speed=1,lastFrame=0,frameHandle=null,currentIndex=-1;
function shiftAt(t){if(t<1)return smooth(t);if(t<4)return 1;if(t<5)return 1-smooth(t-4);return 0}
function render(now){
  t=Math.max(0,Math.min(6,now));
  const q=shiftAt(t),rr=r*q;
  const vq=mul(Vp,q);
  // The two shifted parallels are homothetic to their final positions.
  line('shiftBottom',{x:-131,y:rr},vq);
  line('shiftTop',add(vq,mul(oblique,240)),vq);
  point('vprimeDot',vq);label('vprimeLabel',add(vq,{x:3,y:6}));
  label('labelSprime',{x:-119,y:rr+6.6});
  label('labelRprime',add(add(vq,mul(oblique,125)),mul(nout,4)));
  opacity('shiftedGeometry',q>.003?Math.min(1,q*1.55):0);
  const baseOpacity=1-.79*q;
  opacity('lineBottom',baseOpacity);opacity('lineTop',baseOpacity);
  opacity('labelS',baseOpacity);opacity('labelR',baseOpacity);
  opacity('labelC',1-q);
  set('givenCircle',{r:r*(1-q)});
  opacity('givenCircle',Math.max(.06,1-q));
  opacity('givenRadiusText',1-reveal(t,.55,.9));
  opacity('pointOriginalLabel',Math.max(0,(1-q)*1.1));
  opacity('pointGeometry',Math.min(1,q*2.2));
  const arrows=(reveal(t,.14,.55))*(1-reveal(t,1.15,1.6));
  opacity('offsetArrows',arrows);
  line('bottomArrow',{x:-106,y:0},{x:-106,y:rr});
  const arrowOrigin=mul(oblique,50);
  line('topArrow',arrowOrigin,add(arrowOrigin,mul(nout,rr)));
  label('bottomOffsetLabel',{x:-103,y:rr/2+1});
  label('topOffsetLabel',add(arrowOrigin,add(mul(nout,rr*.55),{x:3,y:-3})));
  // RRP auxiliary constructions appear in explanatory order, then fade.
  const fade=1-reveal(t,4.12,4.83);
  opacity('bisectorGroup',reveal(t,1.10,1.68)*fade);
  opacity('reflectionGroup',reveal(t,1.57,1.96)*fade);
  opacity('powerGroup',reveal(t,2.12,2.85)*fade);
  opacity('centerGroup',reveal(t,3.16,3.78)*(1-reveal(t,5.05,5.65)));
  // Throughout the restitution, the solution loses the SAME radius
  // regained by the given circle, so external tangency is conserved.
  const circleAppear=reveal(t,3.43,3.97);
  const currentR=bigR+rr;
  set('auxCircle',{r:currentR});set('finalCircle',{r:currentR});
  opacity('auxCircle',circleAppear*q);
  opacity('finalCircle',circleAppear*(1-q));
  const finalOpacity=reveal(t,4.72,5.62);
  opacity('finalMarks',finalOpacity);
  const index=Math.max(0,Math.min(6,Math.ceil(t-0.000001)));
  if(index!==currentIndex){
    currentIndex=index;
    $('phaseText').textContent=stepInfo[index];
  }
}
function setTime(v){render(v)}
function updatePlay(){const b=$('play');b.textContent=playing?'❚❚ Pausar':'▶ Reproducir';b.setAttribute('aria-pressed',playing?'true':'false')}
function pause(){playing=false;lastFrame=0;if(frameHandle!==null){cancelAnimationFrame(frameHandle);frameHandle=null}updatePlay()}
function advance(time){
  if(!playing)return;
  if(lastFrame){const dt=Math.min(100,time-lastFrame);setTime(t+dt/1000*(speed/3.25));}
  lastFrame=time;
  if(t>=6){pause();return}
  frameHandle=requestAnimationFrame(advance);
}
function play(){if(playing)return;if(t>=6)setTime(0);playing=true;lastFrame=0;updatePlay();frameHandle=requestAnimationFrame(advance)}
$('play').addEventListener('click',()=>playing?pause():play());
render(0);

</script>
</body>
</html>
